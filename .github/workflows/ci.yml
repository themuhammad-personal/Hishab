name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Lint, unit tests, debug build
        id: gradle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace lintDebug testDebugUnitTest assembleDebug 2>&1 | tee gradle-ci.log
      - name: Surface test and lint failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          def emit(msg):
              msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + msg[:3500])
          count = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              try: root = ET.parse(f).getroot()
              except Exception: continue
              for tc in root.iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      emit(f"{tc.get('classname')}.{tc.get('name')}: {fail.get('message','')}\n{(fail.text or '')[:1800]}")
                      count += 1
          for f in glob.glob('app/build/reports/lint-results-*.xml'):
              try: root = ET.parse(f).getroot()
              except Exception: continue
              for issue in root.findall('issue'):
                  if issue.get('severity') in ('Error','Fatal'):
                      loc = issue.find('location')
                      emit(f"lint {issue.get('id')}: {issue.get('message','')} @ {loc.get('file','') if loc is not None else ''}:{loc.get('line','') if loc is not None else ''}")
                      count += 1
          print(f'surfaced {count} test/lint failures')
          PY
      - name: Surface build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = []
          for name in ('gradle-ci.log', 'gradle-release.log'):
              p = Path(name)
              if p.exists(): lines += p.read_text(errors='replace').splitlines()
          picks = [l for l in lines if re.search(r'^e:|error:|FAILURE|What went wrong|Execution failed|Could not|Unresolved reference|Type mismatch|None of the following|Cannot|A problem|lint found|Errors:|Warnings:|Caused by:|^> |^\* ', l)]
          msg = '\n'.join(picks[-220:]) + '\n---TAIL---\n' + '\n'.join(lines[-220:])
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + msg[:60000])
          PY
      - name: Release compile check (unsigned, not published)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace assembleRelease 2>&1 | tee gradle-release.log
      - name: Persist exported Room schema
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if ! git diff --cached --quiet; then
            git commit -m "chore(room): export v1 schema [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hishab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            gradle-ci.log
            gradle-release.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/schemas/
          if-no-files-found: warn
