name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Lint, unit tests, debug build
        id: gradle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace lintDebug testDebugUnitTest assembleDebug 2>&1 | tee gradle-ci.log
      - name: Surface build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('gradle-ci.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else []
          picks = [l for l in lines if re.search(r'^e:|error:|FAILURE|What went wrong|Execution failed|Could not|Unresolved reference|Type mismatch|None of the following|Cannot|A problem|lint found|Errors:|Warnings:|Caused by:|^> |^\* ', l)]
          msg = '\n'.join(picks[-220:]) + '\n---TAIL---\n' + '\n'.join(lines[-220:])
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + msg[:60000])
          PY
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hishab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            gradle-ci.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
